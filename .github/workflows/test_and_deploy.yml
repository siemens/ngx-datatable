name: Build, Test, and Deploy

on:
  workflow_call:
    secrets:
      CC_TEST_REPORTER_ID:
        required: true
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # We need this for commit-lint

      - name: Set Node Version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/krypton

      - name: Install
        run: npm ci

      - name: Verify generated routes
        run: npm run build:routes && git diff --exit-code

      - name: Build and package library
        run: npm run package

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build:prod

      - name: Build web component examples
        run: npm run build:web-components

      - name: Generate API documentation
        run: npm run docs:api

      - name: Set up documentation tooling
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build documentation
        run: uv sync --frozen && uv run zensical build && cp -r dist/ngx-datatable-examples site/examples

      - name: Archive documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: site

      - name: Archive build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run ci

      - name: Build Stackblitz
        working-directory: projects/stackblitz
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Archive coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success() || failure()
        with:
          name: coverage
          path: coverage/ngx-datatable-lib

      - name: Publish coverage results
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2
        env:
          QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: ${{github.workspace}}/coverage/ngx-datatable-lib/lcov.info
        if: env.QLTY_COVERAGE_TOKEN

  e2e:
    runs-on: ubuntu-latest
    needs: build
    container: mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847
    steps:
      # We cannot use built-in LFS functionality due to the missing support of custom LFS endpoints.
      # See: https://github.com/actions/checkout/issues/365
      # As we are in another container, we even need to install LFS manually.
      - name: Install LFS
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | bash
          apt install git-lfs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pull Repository with LFS
        run: git lfs pull

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Install
        run: npm ci

      - name: E2E
        run: npm run e2e

      - name: Upload E2E Results
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-results
          path: playwright/results

  preview:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    needs:
      - build
      - e2e
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      BUCKET_NAME: ngx-datatable-preview
      PREVIEW_URL: https://d119znxtssp2lg.cloudfront.net
    steps:
      - name: Download documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: documentation
          path: pages

      - name: Download Playwright report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-results
          path: playwright-results

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::974483672234:role/ngx-datatable-preview
          role-session-name: ngx-datatable-preview
          aws-region: eu-west-1

      - name: Publish preview
        run: |
          aws s3 cp --quiet --no-progress --recursive ./pages s3://${{ env.BUCKET_NAME }}/pr-${{ github.event.pull_request.number }}/pages
          aws s3 cp --quiet --no-progress --recursive ./playwright-results/preview s3://${{ env.BUCKET_NAME }}/pr-${{ github.event.pull_request.number }}/playwright-report

      - name: Build PR description block
        run: |
          cat > pr-preview-description.md <<EOF
          <!-- preview-links:start -->

          ---

          [Documentation](${{ env.PREVIEW_URL }}/pr-${{ github.event.pull_request.number }}/pages/).
          [Examples](${{ env.PREVIEW_URL }}/pr-${{ github.event.pull_request.number }}/pages/examples/).
          [Playwright report](${{ env.PREVIEW_URL }}/pr-${{ github.event.pull_request.number }}/playwright-report/).

          <!-- preview-links:end -->
          EOF

      - name: Update PR description block
        uses: nefrob/pr-description@30859d560129561327a48ec569ec3b6aa62dd2c9 # v1.3.0
        with:
          token: ${{ github.token }}
          content: pr-preview-description.md
          contentIsFilePath: true
          regex: '<!-- preview-links:start -->.*?<!-- preview-links:end -->'
          regexFlags: 'ims'
