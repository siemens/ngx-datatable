<div class="datatable-wrapper">
  <div
    datatableScrollContainer
    role="table"
    class="datatable-grid"
    [style.--ngx-datatable-grid-template-columns]="_controller.gridTemplateColumns()"
    [style.scroll-padding-block-start.px]="_isFixedHeader() ? headerHeight() : null"
  >
    @if (headerHeight()) {
      <datatable-header
        role="rowgroup"
        [targetMarkerTemplate]="targetMarkerTemplate()"
        (sort)="onColumnSort($event)"
        (resize)="onColumnResize($event)"
        (resizing)="onColumnResizing($event)"
        (reorder)="onColumnReorder($event)"
        (select)="onHeaderSelect()"
        (columnContextmenu)="onColumnContextmenu($event)"
      />
    }
    <datatable-body
      tabindex="0"
      role="rowgroup"
      [rowDetail]="rowDetail"
      [groupHeader]="groupHeader"
      [summaryRowTemplate]="summaryRowDirective()?.template"
      [rowDragEvents]="rowDragEvents"
      [rowDefTemplate]="_rowDefTemplate()"
      (page)="onBodyPage($event)"
      (activate)="activate.emit($event)"
      (rowContextmenu)="onRowContextmenu($event)"
      (scroll)="onBodyScroll($event)"
      (treeAction)="onTreeAction($event)"
    >
      <ng-content select="[loading-indicator]" ngProjectAs="[loading-indicator]">
        <datatable-progress />
      </ng-content>
      <ng-content select="[empty-content]" ngProjectAs="[empty-content]">
        <div class="empty-row" [innerHTML]="configuration().messages.emptyMessage"></div>
      </ng-content>
    </datatable-body>
  </div>
  @if (footerHeight()) {
    <datatable-footer [footerTemplate]="_footer()" (page)="onFooterPage($event)" />
  }
</div>
