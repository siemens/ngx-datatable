[project]
name = "ngx-datatable-docs"
version = "0.0.0"
description = "Documentation tooling (Zensical) for ngx-datatable."
authors = [
    { name = "Siemens AG", email = "info@siemens.com" },
]
requires-python = ">=3.11"
dependencies = [
    "zensical>=0.0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs_extensions"]
